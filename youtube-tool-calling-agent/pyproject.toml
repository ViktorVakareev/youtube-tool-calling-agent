[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-tool-calling-agent"
version = "1.0.0"
description = "YouTube tool-calling agent with LangChain 1.x — summarize videos, search, metadata, thumbnails via 6 tools, driven by a hand-written loop, fixed and recursive LCEL chains, and create_agent. Real YouTube (yt-dlp) or offline sample data; Gemini (free), OpenAI or offline model. 101 tests, 98% coverage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VictorV" }]
keywords = ["langchain", "langgraph", "lcel", "ai-agents", "tool-calling", "function-calling", "agentic-ai", "llm", "youtube", "yt-dlp", "gemini", "openai", "python", "pytest", "coursera", "portfolio-project"]
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2025.1", "youtube-transcript-api>=1.1"]
gemini = ["langchain-google-genai>=3.0"]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]
all = ["youtube-tool-calling-agent[youtube,gemini,openai,dev]"]

[project.scripts]
yt-agent = "yt_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls a real LLM API (needs GOOGLE_API_KEY or OPENAI_API_KEY); skipped otherwise",
    "youtube: calls real YouTube (needs network and RUN_YOUTUBE_TESTS=1); skipped otherwise",
]
